# CI gate of the Software Factory.
#
# Runs on GitHub-hosted runners. The repository is public, so GitHub Actions
# minutes are free and no self-hosted runner is needed.
#
# The "check" check is the contract: Hermes may complete a card only when it is
# green on the current commit (--completion-contract), and the ruleset on main
# requires it before a pull request can be merged.
#
# Third-party actions are pinned to full commit SHAs.

name: check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the tamper check diffs the pull request against its base.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Run gate
        run: ./check.sh

      - name: Rule out test tampering
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/test_tamper_check.sh "$BASE_SHA" "$HEAD_SHA"
