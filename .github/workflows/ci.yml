# CI-Gate der Software Factory.
#
# Läuft auf dem self-hosted Runner auf dem VPS (Container factory-github-runner).
# Verbraucht keine GitHub-Actions-Minuten. Nur für private Repositories.
#
# Der Check "check" ist der Vertrag: Hermes darf eine Karte erst abschließen,
# wenn er auf dem aktuellen Commit grün ist (--completion-contract).

name: check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, linux, factory]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: uv bereitstellen
        run: command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Gate ausführen
        run: ./check.sh

      - name: Test-Manipulation ausschließen
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/test_tamper_check.sh "$BASE_SHA" "$HEAD_SHA"
