# CI gate of the Software Factory.
#
# Runs on the self-hosted runner on the VPS (container factory-github-runner).
# Consumes no GitHub Actions minutes. Only for private repositories.
#
# The "check" check is the contract: Hermes may complete a card only
# when it is green on the current commit (--completion-contract).

name: check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, linux, factory]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Provide uv
        run: command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run gate
        run: ./check.sh

      - name: Rule out test tampering
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/test_tamper_check.sh "$BASE_SHA" "$HEAD_SHA"
