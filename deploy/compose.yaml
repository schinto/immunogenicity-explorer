# Public deployment at adam.entreater.com on the VPS.
#
# Pattern taken from radar.entreater.com on the same server: Traefik detects the
# container via labels and obtains the certificate via Let's Encrypt (HTTP challenge).
# Traefik runs there with --providers.docker.exposedbydefault=false, so
# traefik.enable=true is required.
#
# Prerequisites and order: see deploy/README.md
services:
  adam:
    image: immunogenicity-explorer:${IDA_VERSION:-dev}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: adam-explorer
    restart: unless-stopped

    # Limit, because the server is short on memory and has no swap.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5

    # On server-wide memory pressure, get killed before the production services,
    # but after the factory containers (those have 1000). The site is stateless
    # and restarts on its own via restart: unless-stopped.
    oom_score_adj: 500

    # The application is read-only. No write access to the file system needed.
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    environment:
      IDA_DATA_DIR: /app/data/idc

    expose:
      - "8000"

    labels:
      - traefik.enable=true
      - traefik.http.routers.adam.rule=Host(`adam.entreater.com`)
      - traefik.http.routers.adam.entrypoints=websecure
      - traefik.http.routers.adam.tls.certresolver=letsencrypt
      - traefik.http.services.adam.loadbalancer.server.port=8000
      # Security headers and compression
      - traefik.http.routers.adam.middlewares=adam-headers,adam-compress,adam-ratelimit
      - traefik.http.middlewares.adam-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.adam-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.adam-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.adam-headers.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.adam-compress.compress=true
      # Protection against simple load spikes on a small server
      - traefik.http.middlewares.adam-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.adam-ratelimit.ratelimit.burst=60

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
